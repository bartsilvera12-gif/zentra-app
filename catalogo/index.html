<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="description" content="Mirá los productos y pedí por WhatsApp.">
<!--
  El catálogo público de un negocio.

  Una sola página, sin build y sin servidor: se sirve estática y lee de
  Supabase desde el navegador. La reja no está acá —acá no hay nada que
  esconder— sino en las vistas `catalogo_negocios` y `catalogo_articulos`,
  que son lo único que `anon` puede leer. Por eso la anon key viaja a la
  vista: es pública por diseño y no abre nada que las vistas no abran.

  A qué negocio corresponde sale de `?e=` en la dirección. Sin eso no hay
  página: no hay un catálogo "de todos".

  El pedido no se guarda en ningún lado. Se arma un texto y se abre WhatsApp.
  Eso es el producto entero: el negocio atiende el pedido donde ya atiende
  todo lo demás, y no hay una bandeja más que alguien tenga que mirar.
-->
<style>
  :root {
    --marca: #04617A;
    --tinta: #141a2e;
    --tinta2: #65707f;
    --tinta3: #8b96a5;
    --borde: #e6e9ef;
    --fondo: #f5f6f9;
    --tarjeta: #ffffff;
    --radio: 14px;
    --sombra: 0 1px 2px rgba(20,26,46,.05), 0 8px 24px rgba(20,26,46,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--tinta);
    background: var(--fondo);
    padding-bottom: 92px;
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  /* ---------- encabezado ---------- */
  .tapa { background: var(--marca); color: #fff; padding: 20px 16px 22px; }
  .tapa .fila { display: flex; align-items: center; gap: 12px; }
  .tapa img.logo {
    width: 54px; height: 54px; border-radius: 13px; object-fit: cover;
    background: rgba(255,255,255,.18); flex: 0 0 auto;
  }
  .tapa h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .tapa .sub { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  .tapa .nota {
    margin: 14px 0 0; font-size: 13px; line-height: 1.5;
    background: rgba(255,255,255,.14); padding: 10px 12px; border-radius: 10px;
  }

  /* ---------- filtros ---------- */
  .barra { position: sticky; top: 0; z-index: 20; background: var(--fondo); padding: 12px 0 8px; }
  .buscador {
    margin: 0 16px; display: flex; align-items: center; gap: 9px;
    padding: 0 14px; border: 1px solid var(--borde); border-radius: 11px;
    background: var(--tarjeta);
  }
  .buscador input {
    flex: 1; min-width: 0; font-size: 16px; padding: 11px 0;
    border: 0; background: none; color: var(--tinta); outline: none;
    /* Safari le dibuja su propio marco al campo igual que se le saque el
       borde: sin esto queda una cajita adentro de la caja. */
    appearance: none; -webkit-appearance: none;
  }
  .buscador svg { flex: 0 0 auto; opacity: .45; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--tarjeta); border: 1px solid var(--borde); color: var(--tinta2);
  }
  .chip[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: #fff; }

  /* ---------- grilla ---------- */
  .grilla {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px;
  }
  @media (min-width: 620px) { .grilla { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) {
    .grilla { grid-template-columns: repeat(4, 1fr); max-width: 1100px; margin: 0 auto; }
    .tapa .fila, .buscador, .chips { max-width: 1100px; margin-left: auto; margin-right: auto; }
  }
  .card {
    background: var(--tarjeta); border-radius: var(--radio); overflow: hidden;
    box-shadow: var(--sombra); display: flex; flex-direction: column; text-align: left;
  }
  .card .foto { aspect-ratio: 1; width: 100%; object-fit: cover; background: #eef1f5; }
  /* Sin foto no se deja un hueco gris: va la inicial, grande, sobre el color
     de la marca. Un catálogo sin fotos tiene que verse decidido, no roto. */
  .card .sinfoto {
    aspect-ratio: 1; display: grid; place-items: center;
    font-size: 34px; font-weight: 700; color: #fff; opacity: .95;
    background: var(--marca);
  }
  .card .cuerpo { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card .nom { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .card .precio { font-size: 15px; font-weight: 700; margin-top: auto; padding-top: 6px; }
  .card .cat { font-size: 11px; color: var(--tinta3); }

  /* ---------- hoja de producto ---------- */
  .velo {
    position: fixed; inset: 0; background: rgba(10,16,30,.55); z-index: 40;
    display: grid; align-items: end; justify-items: center;
  }
  .hoja {
    background: var(--tarjeta); width: 100%; max-width: 520px;
    border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow: auto;
  }
  @media (min-width: 620px) { .velo { align-items: center; } .hoja { border-radius: 18px; } }
  .hoja .foto, .hoja .sinfoto { border-radius: 12px; aspect-ratio: 1; width: 100%; object-fit: cover; }
  .hoja .sinfoto { display: grid; place-items: center; font-size: 56px; font-weight: 700; color: #fff; background: var(--marca); }
  .hoja h2 { margin: 14px 0 2px; font-size: 19px; }
  .hoja .precio { font-size: 21px; font-weight: 700; }
  .contador { display: flex; align-items: center; gap: 16px; margin: 16px 0 12px; }
  .contador button {
    width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--borde);
    font-size: 19px; line-height: 1; background: var(--fondo);
  }
  .contador span { font-size: 18px; font-weight: 700; min-width: 26px; text-align: center; }
  textarea, input[type="text"], input[type="tel"] {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--borde); border-radius: 11px; background: var(--fondo); color: var(--tinta);
  }
  textarea { resize: vertical; min-height: 64px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--tinta2); margin: 12px 0 5px; }
  .primario {
    width: 100%; background: var(--marca); color: #fff; font-weight: 700; font-size: 16px;
    padding: 15px; border-radius: 13px; margin-top: 14px;
  }
  .secundario { width: 100%; padding: 13px; color: var(--tinta2); font-weight: 600; }

  /* ---------- carrito ---------- */
  .pie {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    border-top: 1px solid var(--borde);
  }
  .pie button { width: 100%; max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between;
    align-items: center; background: var(--marca); color: #fff; font-weight: 700;
    padding: 15px 18px; border-radius: 13px; font-size: 15px; }
  .linea { display: flex; gap: 11px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--borde); }
  .linea .mini { width: 50px; height: 50px; border-radius: 9px; object-fit: cover; flex: 0 0 auto; background: #eef1f5; }
  .linea .minisin { width: 50px; height: 50px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
    background: var(--marca); color: #fff; font-weight: 700; }
  .linea .info { flex: 1; min-width: 0; }
  .linea .info b { display: block; font-size: 13.5px; font-weight: 600; }
  .linea .info small { color: var(--tinta2); font-size: 12px; }
  .quitar { color: #8C2F2B; font-size: 12.5px; font-weight: 600; padding: 4px; }

  .aviso { padding: 48px 24px; text-align: center; color: var(--tinta2); }
  .aviso b { display: block; color: var(--tinta); font-size: 17px; margin-bottom: 6px; }
  .oculto { display: none !important; }
</style>
</head>
<body>

<div id="app"></div>
<div id="pie"></div>
<div id="capa"></div>

<script>
const SUPABASE = "https://db-zentra.neura.com.py";
const ANON = "__ANON__";

const $ = (s, d = document) => d.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/** Guaraníes: enteros y con puntos, como se escribe acá. */
const gs = (n) => "Gs " + Math.round(Number(n) || 0).toLocaleString("es-PY");

/** La foto, armada desde el camino guardado. Nulo cuando no hay. */
const foto = (p) => p ? `${SUPABASE}/storage/v1/object/public/catalogo/${p}` : null;

/** `0981 123 456` → `595981123456`. WhatsApp quiere el internacional sin el cero. */
function waNumero(t) {
  const d = String(t || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("595")) return d;
  return "595" + d.replace(/^0+/, "");
}

async function leer(vista, query) {
  const r = await fetch(`${SUPABASE}/rest/v1/${vista}?${query}`, {
    headers: { apikey: ANON, Authorization: `Bearer ${ANON}` },
  });
  if (!r.ok) throw new Error(`${vista}: ${r.status}`);
  return r.json();
}

// ---------- estado ----------

const slug = new URLSearchParams(location.search).get("e")?.trim().toLowerCase() || "";
let negocio = null;
let articulos = [];
let categoria = "Todos";
let busqueda = "";
// El carrito vive en el navegador del cliente. No hay cuenta, no hay servidor:
// si cierra y vuelve, su pedido sigue ahí.
let carrito = {};
try { carrito = JSON.parse(localStorage.getItem("carrito:" + slug) || "{}"); } catch {}

const guardar = () => {
  try { localStorage.setItem("carrito:" + slug, JSON.stringify(carrito)); } catch {}
};

const items = () => Object.values(carrito).filter((l) => l.qty > 0);
const total = () => items().reduce((a, l) => a + l.precio * l.qty, 0);

// ---------- arranque ----------

(async function iniciar() {
  if (!slug) return vacio("Falta el código del negocio", "La dirección tiene que terminar en <code>?e=</code> y el nombre del negocio.");

  try {
    const [negocios, arts] = await Promise.all([
      leer("catalogo_negocios", `slug=eq.${encodeURIComponent(slug)}&limit=1`),
      leer("catalogo_articulos", `slug=eq.${encodeURIComponent(slug)}&order=nombre.asc`),
    ]);
    negocio = negocios[0];
    articulos = arts;
  } catch (e) {
    return vacio("No pudimos cargar el catálogo", "Revisá tu conexión y volvé a intentar.");
  }

  if (!negocio) return vacio("No encontramos ese catálogo", "Puede que el negocio lo haya apagado, o que la dirección esté mal escrita.");

  document.title = negocio.nombre + " · Catálogo";
  if (negocio.color) document.documentElement.style.setProperty("--marca", negocio.color);
  dibujar();
})();

function vacio(titulo, texto) {
  $("#app").innerHTML = `<div class="aviso"><b>${esc(titulo)}</b>${texto}</div>`;
}

// ---------- pantalla ----------

function categorias() {
  const vistas = [...new Set(articulos.map((a) => (a.categoria || "").trim()).filter(Boolean))].sort();
  return vistas.length ? ["Todos", ...vistas] : [];
}

function visibles() {
  const q = busqueda.trim().toLowerCase();
  return articulos.filter((a) => {
    if (categoria !== "Todos" && (a.categoria || "").trim() !== categoria) return false;
    return !q || a.nombre.toLowerCase().includes(q);
  });
}

function dibujar() {
  const cats = categorias();
  const lista = visibles();

  $("#app").innerHTML = `
    <header class="tapa">
      <div class="fila">
        ${negocio.logo_path
          ? `<img class="logo" src="${esc(foto(negocio.logo_path))}" alt="">`
          : `<div class="logo"></div>`}
        <div>
          <h1>${esc(negocio.nombre)}</h1>
          ${negocio.ciudad ? `<p class="sub">${esc(negocio.ciudad)}</p>` : ""}
        </div>
      </div>
      ${negocio.mensaje ? `<p class="nota">${esc(negocio.mensaje)}</p>` : ""}
    </header>

    <div class="barra">
      <div class="buscador">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="q" type="text" placeholder="Buscar producto" value="${esc(busqueda)}"
               autocomplete="off" enterkeyhint="search">
      </div>
      ${cats.length ? `<div class="chips">${cats.map((c) =>
        `<button class="chip" aria-pressed="${c === categoria}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
    </div>

    ${lista.length
      ? `<div class="grilla">${lista.map(tarjeta).join("")}</div>`
      : `<div class="aviso"><b>No hay productos</b>${busqueda || categoria !== "Todos"
          ? "Probá con otro nombre o cambiá la categoría." : "Este negocio todavía no cargó ninguno."}</div>`}
  `;

  const q = $("#q");
  q.addEventListener("input", (e) => {
    busqueda = e.target.value;
    const foco = document.activeElement === q;
    dibujar();
    if (foco) { const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  document.querySelectorAll("[data-cat]").forEach((b) =>
    b.addEventListener("click", () => { categoria = b.dataset.cat; dibujar(); }));
  document.querySelectorAll("[data-art]").forEach((b) =>
    b.addEventListener("click", () => abrirProducto(b.dataset.art)));

  pie();
}

function tarjeta(a) {
  const u = foto(a.imagen_path);
  return `
    <button class="card" data-art="${esc(a.id)}">
      ${u ? `<img class="foto" src="${esc(u)}" alt="" loading="lazy">`
          : `<div class="sinfoto">${esc(a.nombre.trim()[0] || "·")}</div>`}
      <div class="cuerpo">
        <div class="nom">${esc(a.nombre)}</div>
        ${a.categoria ? `<div class="cat">${esc(a.categoria)}</div>` : ""}
        <div class="precio">${gs(a.precio)}</div>
      </div>
    </button>`;
}

// ---------- producto ----------

function abrirProducto(id) {
  const a = articulos.find((x) => String(x.id) === String(id));
  if (!a) return;
  const u = foto(a.imagen_path);
  const ya = carrito[a.id];
  let qty = ya?.qty || 1;

  capa(`
    ${u ? `<img class="foto" src="${esc(u)}" alt="">`
        : `<div class="sinfoto">${esc(a.nombre.trim()[0] || "·")}</div>`}
    <h2>${esc(a.nombre)}</h2>
    ${a.categoria ? `<div class="cat" style="color:var(--tinta3);font-size:12.5px">${esc(a.categoria)}</div>` : ""}
    <div class="precio">${gs(a.precio)}</div>

    <div class="contador">
      <button id="menos" aria-label="Menos">−</button>
      <span id="qty">${qty}</span>
      <button id="mas" aria-label="Más">+</button>
      <div style="margin-left:auto;font-weight:700" id="sub">${gs(a.precio * qty)}</div>
    </div>

    <label for="nota">Nota para este producto</label>
    <textarea id="nota" placeholder="Color, tamaño, lo que haga falta">${esc(ya?.nota || "")}</textarea>

    <button class="primario" id="agregar">${ya ? "Actualizar" : "Agregar al pedido"}</button>
    <button class="secundario" id="cerrar">Seguir mirando</button>
  `);

  const pintar = () => {
    $("#qty").textContent = qty;
    $("#sub").textContent = gs(a.precio * qty);
  };
  $("#menos").onclick = () => { qty = Math.max(1, qty - 1); pintar(); };
  $("#mas").onclick = () => { qty = Math.min(999, qty + 1); pintar(); };
  $("#agregar").onclick = () => {
    carrito[a.id] = { id: a.id, nombre: a.nombre, precio: a.precio, imagen_path: a.imagen_path,
                      qty, nota: $("#nota").value.trim() };
    guardar(); cerrarCapa(); pie();
  };
  $("#cerrar").onclick = cerrarCapa;
}

// ---------- carrito ----------

function pie() {
  const n = items().reduce((a, l) => a + l.qty, 0);
  $("#pie").innerHTML = n
    ? `<div class="pie"><button id="verCarrito">
         <span>Ver el pedido · ${n} ${n === 1 ? "producto" : "productos"}</span>
         <span>${gs(total())}</span></button></div>`
    : "";
  if (n) $("#verCarrito").onclick = abrirCarrito;
}

function abrirCarrito() {
  const ls = items();
  if (!ls.length) return;

  const datos = JSON.parse(localStorage.getItem("datos:" + slug) || "{}");

  capa(`
    <h2 style="margin-top:0">Tu pedido</h2>
    <div id="lineas">${ls.map(linea).join("")}</div>

    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding:14px 0">
      <span>Total</span><span>${gs(total())}</span>
    </div>

    <label for="nom">Tu nombre</label>
    <input id="nom" type="text" value="${esc(datos.nombre || "")}" placeholder="Para saber a quién le preparamos">
    <label for="tel">Tu teléfono</label>
    <input id="tel" type="tel" value="${esc(datos.tel || "")}" placeholder="09xx xxx xxx" inputmode="tel">
    <label for="obs">Algo más que quieras decirnos</label>
    <textarea id="obs" placeholder="Dirección, horario, forma de pago">${esc(datos.obs || "")}</textarea>

    <button class="primario" id="enviar">Pedir por WhatsApp</button>
    <button class="secundario" id="cerrar">Seguir mirando</button>
  `);

  document.querySelectorAll("[data-quitar]").forEach((b) =>
    b.addEventListener("click", () => {
      delete carrito[b.dataset.quitar];
      guardar(); pie();
      items().length ? abrirCarrito() : cerrarCapa();
    }));

  $("#cerrar").onclick = cerrarCapa;
  $("#enviar").onclick = () => {
    const nombre = $("#nom").value.trim();
    const tel = $("#tel").value.trim();
    const obs = $("#obs").value.trim();
    try { localStorage.setItem("datos:" + slug, JSON.stringify({ nombre, tel, obs })); } catch {}
    location.href = enlaceWhatsapp(nombre, tel, obs);
  };
}

function linea(l) {
  const u = foto(l.imagen_path);
  return `<div class="linea">
    ${u ? `<img class="mini" src="${esc(u)}" alt="">`
        : `<div class="minisin">${esc(l.nombre.trim()[0] || "·")}</div>`}
    <div class="info">
      <b>${esc(l.nombre)}</b>
      <small>${l.qty} × ${gs(l.precio)} = ${gs(l.qty * l.precio)}</small>
      ${l.nota ? `<small style="display:block">“${esc(l.nota)}”</small>` : ""}
    </div>
    <button class="quitar" data-quitar="${esc(l.id)}">Quitar</button>
  </div>`;
}

/**
 * El pedido, como texto de WhatsApp.
 *
 * Es todo el producto: no se guarda en ningún lado, le llega al negocio donde
 * ya atiende. Por eso el texto tiene que alcanzar solo — quién pide, qué, y
 * cómo ubicarlo.
 */
function enlaceWhatsapp(nombre, tel, obs) {
  const l = [`*Pedido · ${negocio.nombre}*`, ""];
  for (const it of items()) {
    l.push(`• ${it.nombre} — ${it.qty} × ${gs(it.precio)} = ${gs(it.qty * it.precio)}`);
    if (it.nota) l.push(`   (${it.nota})`);
  }
  l.push("", `*Total: ${gs(total())}*`, "");
  if (nombre) l.push(`Nombre: ${nombre}`);
  if (tel) l.push(`Teléfono: ${tel}`);
  if (obs) l.push(`Nota: ${obs}`);
  return `https://wa.me/${waNumero(negocio.whatsapp)}?text=${encodeURIComponent(l.join("\n"))}`;
}

// ---------- hoja ----------

function capa(html) {
  $("#capa").innerHTML = `<div class="velo"><div class="hoja">${html}</div></div>`;
  document.body.style.overflow = "hidden";
  $("#capa .velo").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) cerrarCapa();
  });
}

function cerrarCapa() {
  $("#capa").innerHTML = "";
  document.body.style.overflow = "";
}
</script>
</body>
</html>
