<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="description" content="Mirá los productos y pedí por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;800&display=swap">
<!--
  El catálogo público de un negocio.

  Una sola página, sin build y sin servidor: se sirve estática y lee de
  Supabase desde el navegador. La reja no está acá —acá no hay nada que
  esconder— sino en las vistas `catalogo_negocios` y `catalogo_articulos`,
  que son lo único que `anon` puede leer. Por eso la anon key viaja a la
  vista: es pública por diseño y no abre nada que las vistas no abran.

  A qué negocio corresponde sale de la dirección: `catalogo.neura.com.py/velas-ana`.

  El pedido no se guarda en ningún lado. Se arma un texto y se abre WhatsApp.
  Eso es el producto entero: el negocio atiende el pedido donde ya atiende
  todo lo demás, y no hay una bandeja más que alguien tenga que mirar.

  ── Sobre el diseño ──

  El color lo elige cada negocio de una paleta de seis, así que la página no
  puede apoyarse en él: tiene que verse igual de bien con el rosa de una
  velería que con el azul de una ferretería. Por eso el color aparece en tres
  lugares contados —el botón del pedido, la categoría elegida, el punto al
  lado del nombre— y todo lo demás es papel, tinta y una línea fina.

  Lo que manda es la foto del producto. Las tarjetas no tienen marco, ni
  sombra, ni fondo: una foto cuadrada, el nombre y el precio. En una grilla de
  veinte productos, veinte marcos compiten entre sí y no gana ninguno.

  Una sola familia tipográfica con mucho rango de peso. Dos familias en una
  vidriera es una decisión que se nota, y acá lo que tiene que notarse es lo
  que se vende.
-->
<style>
  /* Vitrina: barra fija arriba con el pedido, y abajo una grilla de fotos sin
     marco. El color del negocio sólo en lo que se toca. */
  :root {
    --marca: #04617A;
    /* Sobre el color del negocio siempre va blanco: los seis de la paleta son
       oscuros y saturados, elegidos para eso. */
    --sobre-marca: #ffffff;

    --papel: #ffffff;
    --papel-2: #f7f7f8;
    --tinta: #16181d;
    --tinta-2: #5f646e;
    --tinta-3: #9aa0ab;
    --linea: #e8e9ec;

    --radio: 10px;
    --gutter: 18px;

    --tipo: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #111216;
      --papel-2: #191a1f;
      --tinta: #f2f3f5;
      --tinta-2: #a5abb6;
      --tinta-3: #6e7682;
      --linea: #26282e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --papel: #111216;
    --papel-2: #191a1f;
    --tinta: #f2f3f5;
    --tinta-2: #a5abb6;
    --tinta-3: #6e7682;
    --linea: #26282e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--tipo);
    font-size: 15px;
    line-height: 1.5;
    color: var(--tinta);
    background: var(--papel);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }

  .ancho {
    max-width: 1080px; margin: 0 auto;
    padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  }

  /* ---------- barra de arriba ---------- */

  .barra {
    position: sticky; top: 0; z-index: 30;
    background: var(--papel);
    border-bottom: 1px solid var(--linea);
  }
  @supports (backdrop-filter: blur(1px)) {
    .barra {
      background: color-mix(in srgb, var(--papel) 86%, transparent);
      backdrop-filter: saturate(1.6) blur(14px);
    }
  }
  .barra .ancho {
    display: flex; align-items: center; gap: 12px;
    padding-block: 11px;
    padding-top: max(11px, env(safe-area-inset-top, 0px));
  }
  .marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .marca img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; }
  /* Sin logo, un punto del color del negocio. Alcanza para que el nombre deje
     de ser texto suelto y se lea como una marca. */
  .punto { width: 9px; height: 9px; border-radius: 999px; background: var(--marca); flex: 0 0 auto; }
  .marca h1 {
    margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .pedido {
    margin-left: auto; flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px;
    background: var(--marca); color: var(--sobre-marca);
    font-size: 13.5px; font-weight: 600;
    transition: transform .16s ease;
  }
  .pedido:active { transform: scale(.96); }
  .pedido .n {
    font-variant-numeric: tabular-nums; font-weight: 800;
    background: color-mix(in srgb, var(--sobre-marca) 24%, transparent);
    border-radius: 999px; padding: 1px 7px;
  }
  /* Vacío queda como contorno: un botón sólido que no lleva a ningún lado
     promete algo que todavía no existe. */
  .pedido[data-vacio="si"] {
    background: none; color: var(--tinta-2);
    box-shadow: inset 0 0 0 1px var(--linea);
  }

  /* ---------- presentación ---------- */

  .tapa { padding-block: 26px 4px; }
  .tapa h2 {
    margin: 0; font-size: clamp(26px, 7vw, 38px); font-weight: 800;
    letter-spacing: -.035em; line-height: 1.08; text-wrap: balance;
  }
  .tapa .donde { margin: 7px 0 0; font-size: 14px; color: var(--tinta-3); }
  .tapa .nota {
    margin: 16px 0 0; font-size: 14px; color: var(--tinta-2);
    max-width: 62ch; white-space: pre-wrap;
    padding-left: 13px; border-left: 2px solid var(--marca);
  }

  /* ---------- filtros ---------- */

  .filtros { padding-block: 22px 6px; display: flex; flex-direction: column; gap: 14px; }
  .buscador {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; height: 46px;
    border-radius: var(--radio); background: var(--papel-2);
    box-shadow: inset 0 0 0 1px var(--linea);
  }
  .buscador:focus-within { box-shadow: inset 0 0 0 1.5px var(--marca); }
  .buscador svg { flex: 0 0 auto; color: var(--tinta-3); }
  .buscador input {
    flex: 1; min-width: 0; height: 100%;
    font: inherit; font-size: 16px; color: var(--tinta);
    border: 0; background: none; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  .buscador input::placeholder { color: var(--tinta-3); }

  .chips {
    display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
    margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--tinta-2);
    box-shadow: inset 0 0 0 1px var(--linea);
    transition: color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .chip[aria-pressed="true"] { background: var(--marca); color: var(--sobre-marca); box-shadow: none; }

  /* ---------- la grilla ---------- */

  .grilla {
    display: grid; grid-template-columns: repeat(2, 1fr);
    column-gap: 14px; row-gap: 28px;
    padding-block: 22px 56px;
  }
  @media (min-width: 560px) { .grilla { grid-template-columns: repeat(3, 1fr); column-gap: 20px; row-gap: 36px; } }
  @media (min-width: 860px) { .grilla { grid-template-columns: repeat(4, 1fr); } }

  /* Sin marco, sin sombra, sin fondo: en una grilla de veinte productos,
     veinte marcos compiten entre sí y no gana ninguno. */
  .art { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .art .marco {
    position: relative; aspect-ratio: 1; width: 100%; max-width: 100%;
    border-radius: var(--radio); overflow: hidden; background: var(--papel-2);
  }
  .art .marco img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s cubic-bezier(.2,.7,.3,1); }
  .art:hover .marco img { transform: scale(1.035); }
  .sinfoto { width: 100%; height: 100%; display: grid; place-items: center;
             font-size: 26px; font-weight: 300; color: var(--tinta-3); }
  .art h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .art .desc {
    margin: 0; font-size: 12.5px; color: var(--tinta-3); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .art .precio { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  /* La marca de lo que ya está en el pedido. Un número y no un tilde: lo que
     se quiere saber al volver a la grilla es cuántos llevo. */
  .art .llevo {
    position: absolute; top: 8px; right: 8px;
    min-width: 24px; height: 24px; padding: 0 7px;
    display: grid; place-items: center; border-radius: 999px;
    background: var(--marca); color: var(--sobre-marca);
    font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
  }

  /* ---------- hoja ---------- */

  .velo {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(12, 14, 20, .45);
    display: grid; align-items: end; justify-items: center;
    animation: aparecer .18s ease;
  }
  .hoja {
    background: var(--papel); width: 100%; max-width: 540px;
    border-radius: 20px 20px 0 0;
    max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
    animation: subir .26s cubic-bezier(.2,.8,.25,1);
  }
  .hoja > .cuerpo {
    padding: 18px;
    padding-bottom: max(18px, calc(18px + env(safe-area-inset-bottom, 0px)));
  }
  @media (min-width: 560px) {
    .velo { align-items: center; }
    .hoja { border-radius: 18px; }
  }
  @keyframes aparecer { from { opacity: 0 } }
  @keyframes subir { from { transform: translateY(14px) } }
  @media (prefers-reduced-motion: reduce) {
    .velo, .hoja { animation: none; }
    .art .marco img { transition: none; }
  }

  .hoja .grande { aspect-ratio: 1; width: 100%; border-radius: 14px; overflow: hidden; background: var(--papel-2); }
  .hoja .grande img { width: 100%; height: 100%; object-fit: cover; }
  .hoja h2 { margin: 16px 0 3px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .hoja .cat { font-size: 12.5px; color: var(--tinta-3); }
  .hoja .precio-g { margin-top: 6px; font-size: 24px; font-weight: 800;
                    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hoja .texto { margin: 12px 0 0; font-size: 14px; color: var(--tinta-2); white-space: pre-wrap; }

  .contador { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .contador button {
    width: 42px; height: 42px; border-radius: 999px;
    font-size: 19px; line-height: 1;
    box-shadow: inset 0 0 0 1px var(--linea);
    transition: transform .14s ease;
  }
  .contador button:active { transform: scale(.92); }
  .contador .q { font-size: 18px; font-weight: 800; min-width: 30px; text-align: center;
                 font-variant-numeric: tabular-nums; }
  .contador .sub { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }

  label { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
          text-transform: uppercase; color: var(--tinta-3); margin: 18px 0 7px; }
  textarea, input[type="text"], input[type="tel"] {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 13px;
    color: var(--tinta); background: var(--papel-2);
    border: 0; border-radius: var(--radio); outline: none;
    box-shadow: inset 0 0 0 1px var(--linea);
    appearance: none; -webkit-appearance: none;
  }
  textarea:focus, input:focus { box-shadow: inset 0 0 0 1.5px var(--marca); }
  textarea { resize: vertical; min-height: 68px; }

  .primario {
    width: 100%; margin-top: 20px; padding: 16px;
    border-radius: 13px; font-size: 15.5px; font-weight: 700;
    background: var(--marca); color: var(--sobre-marca);
    transition: transform .14s ease;
  }
  .primario:active { transform: scale(.985); }
  .secundario { width: 100%; padding: 14px; margin-top: 2px; color: var(--tinta-3);
                font-weight: 600; font-size: 14px; }

  /* ---------- el pedido ---------- */

  .linea { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--linea); }
  .linea .mini { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex: 0 0 auto; background: var(--papel-2); }
  .linea .minisin { width: 52px; height: 52px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
                    background: var(--papel-2); color: var(--tinta-3); font-weight: 300; font-size: 17px; }
  .linea .info { flex: 1; min-width: 0; }
  .linea .info b { display: block; font-size: 13.5px; font-weight: 600; }
  .linea .info small { display: block; color: var(--tinta-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .quitar { color: var(--tinta-3); font-size: 12.5px; font-weight: 600; padding: 6px 2px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 2px; font-weight: 800; }
  .total .n { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  /* ---------- avisos ---------- */

  .aviso { padding: 72px 0; text-align: center; color: var(--tinta-2); }
  .aviso b { display: block; color: var(--tinta); font-size: 19px; font-weight: 800;
             letter-spacing: -.02em; margin-bottom: 7px; }
  .aviso p { margin: 0 auto; font-size: 14px; max-width: 42ch; }

  .pie { padding-block: 34px 44px; border-top: 1px solid var(--linea); text-align: center; }
  .pie small { font-size: 12px; color: var(--tinta-3); }
</style>
</head>
<body>

<div id="barra"></div>
<main id="app" class="ancho"></main>
<div id="capa"></div>

<script>
const SUPABASE = "https://db-zentra.neura.com.py";
const ANON = "__ANON__";

const $ = (s, d = document) => d.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/** Guaraníes: enteros y con puntos, como se escribe acá. */
const gs = (n) => "Gs " + Math.round(Number(n) || 0).toLocaleString("es-PY");

/** La foto, armada desde el camino guardado. Nulo cuando no hay. */
const foto = (p) => p ? `${SUPABASE}/storage/v1/object/public/catalogo/${p}` : null;

/** La inicial, para el lugar de la foto que no hay. */
const inicial = (n) => (String(n || "").trim()[0] || "·").toUpperCase();

/** `0981 123 456` → `595981123456`. WhatsApp quiere el internacional sin el cero. */
function waNumero(t) {
  const d = String(t || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("595")) return d;
  return "595" + d.replace(/^0+/, "");
}

async function leer(vista, query) {
  const r = await fetch(`${SUPABASE}/rest/v1/${vista}?${query}`, {
    headers: {
      apikey: ANON,
      Authorization: `Bearer ${ANON}`,
      // El schema va en la cabecera y no en la ruta. Sin esto PostgREST busca
      // en `public`, que es donde no está nada de esto, y contesta "no
      // encontré la tabla" con un 404 que parece un catálogo inexistente.
      "Accept-Profile": "zentra",
    },
  });
  if (!r.ok) throw new Error(`${vista}: ${r.status}`);
  return r.json();
}

// ---------- estado ----------

/**
 * De dónde sale a qué negocio corresponde esta página.
 *
 * De la dirección: `catalogo.neura.com.py/velas-ana`. Se dicta por teléfono y
 * se pega en la bio de Instagram, así que tiene que leerse como un nombre y no
 * como una consulta con signos.
 *
 * `BASE` es lo que hay que sacarle adelante cuando el sitio no vive en la raíz
 * del dominio —en GitHub Pages cuelga del nombre del repo—. Con dominio propio
 * queda en "".
 *
 * `?e=` sigue andando: es lo que se usa para probar y lo que queda escrito en
 * cualquier enlace viejo.
 */
const BASE = "__BASE__";

const slug = (() => {
  const q = new URLSearchParams(location.search).get("e");
  if (q) return q.trim().toLowerCase();
  let ruta = location.pathname;
  if (BASE && ruta.startsWith(BASE)) ruta = ruta.slice(BASE.length);
  const ultimo = ruta.split("/").filter(Boolean).pop() || "";
  // `index.html` es la raíz, no un negocio llamado así.
  return /^[a-z0-9][a-z0-9-]*$/.test(ultimo) ? ultimo : "";
})();

let negocio = null;
let articulos = [];
let categoria = "Todos";
let busqueda = "";
// El carrito vive en el navegador del cliente. No hay cuenta, no hay servidor:
// si cierra y vuelve, su pedido sigue ahí.
let carrito = {};
try { carrito = JSON.parse(localStorage.getItem("carrito:" + slug) || "{}"); } catch {}

const guardar = () => {
  try { localStorage.setItem("carrito:" + slug, JSON.stringify(carrito)); } catch {}
};

const items = () => Object.values(carrito).filter((l) => l.qty > 0);
const cuantos = () => items().reduce((a, l) => a + l.qty, 0);
const total = () => items().reduce((a, l) => a + l.precio * l.qty, 0);

// ---------- arranque ----------

(async function iniciar() {
  if (!slug) return vacio("Falta el nombre del negocio",
                          "La dirección tiene que terminar con el nombre del negocio.");

  try {
    const [negocios, arts] = await Promise.all([
      leer("catalogo_negocios", `slug=eq.${encodeURIComponent(slug)}&limit=1`),
      leer("catalogo_articulos", `slug=eq.${encodeURIComponent(slug)}&order=nombre.asc`),
    ]);
    negocio = negocios[0];
    articulos = arts;
  } catch {
    return vacio("No pudimos cargar el catálogo", "Revisá tu conexión y volvé a intentar.");
  }

  if (!negocio) return vacio("No encontramos ese catálogo",
                             "Puede que el negocio lo haya apagado, o que la dirección esté mal escrita.");

  document.title = negocio.nombre + " · Catálogo";
  if (negocio.color) document.documentElement.style.setProperty("--marca", negocio.color);
  dibujar();
})();

function vacio(titulo, texto) {
  $("#app").innerHTML = `<div class="aviso"><b>${esc(titulo)}</b><p>${esc(texto)}</p></div>`;
}

// ---------- pantalla ----------

function categorias() {
  const vistas = [...new Set(articulos.map((a) => (a.categoria || "").trim()).filter(Boolean))].sort();
  return vistas.length ? ["Todos", ...vistas] : [];
}

function visibles() {
  const q = busqueda.trim().toLowerCase();
  return articulos.filter((a) => {
    if (categoria !== "Todos" && (a.categoria || "").trim() !== categoria) return false;
    if (!q) return true;
    return a.nombre.toLowerCase().includes(q)
        || (a.descripcion || "").toLowerCase().includes(q);
  });
}

function dibujar() {
  barra();

  const cats = categorias();
  const lista = visibles();

  $("#app").innerHTML = `
    <header class="tapa">
      <h2>${esc(negocio.nombre)}</h2>
      ${negocio.ciudad ? `<p class="donde">${esc(negocio.ciudad)}</p>` : ""}
      ${negocio.mensaje ? `<p class="nota">${esc(negocio.mensaje)}</p>` : ""}
    </header>

    <div class="filtros">
      <div class="buscador">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
        </svg>
        <input id="q" type="text" placeholder="Buscar producto" value="${esc(busqueda)}"
               autocomplete="off" enterkeyhint="search">
      </div>
      ${cats.length ? `<div class="chips">${cats.map((c) =>
        `<button class="chip" aria-pressed="${c === categoria}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
    </div>

    ${lista.length
      ? `<div class="grilla">${lista.map(tarjeta).join("")}</div>`
      : `<div class="aviso"><b>No hay productos</b><p>${busqueda || categoria !== "Todos"
          ? "Probá con otro nombre o cambiá la categoría."
          : "Este negocio todavía no cargó ninguno."}</p></div>`}

    <footer class="pie"><small>Pedidos por WhatsApp</small></footer>
  `;

  const q = $("#q");
  q.addEventListener("input", (e) => {
    busqueda = e.target.value;
    const foco = document.activeElement === q;
    dibujar();
    if (foco) { const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  document.querySelectorAll("[data-cat]").forEach((b) =>
    b.addEventListener("click", () => { categoria = b.dataset.cat; dibujar(); }));
  document.querySelectorAll("[data-art]").forEach((b) =>
    b.addEventListener("click", () => abrirProducto(b.dataset.art)));
}

function barra() {
  const n = cuantos();
  $("#barra").innerHTML = `
    <div class="barra"><div class="ancho">
      <div class="marca">
        ${negocio.logo_path
          ? `<img src="${esc(foto(negocio.logo_path))}" alt="">`
          : `<span class="punto"></span>`}
        <h1>${esc(negocio.nombre)}</h1>
      </div>
      <button class="pedido" id="verPedido" data-vacio="${n ? "no" : "si"}" aria-label="Ver el pedido">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 6h15l-1.6 8.4a2 2 0 0 1-2 1.6H9.3a2 2 0 0 1-2-1.6L5.4 4H3"/>
          <circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/>
        </svg>
        <span>Pedido</span>
        ${n ? `<span class="n">${n}</span>` : ""}
      </button>
    </div></div>
  `;
  $("#verPedido").onclick = () => (cuantos() ? abrirPedido() : avisoVacio());
}

function tarjeta(a) {
  const u = foto(a.imagen_path);
  const q = carrito[a.id]?.qty || 0;
  return `
    <button class="art" data-art="${esc(a.id)}">
      <div class="marco">
        ${u ? `<img src="${esc(u)}" alt="" loading="lazy">`
            : `<div class="sinfoto">${esc(inicial(a.nombre))}</div>`}
        ${q ? `<span class="llevo">${q}</span>` : ""}
      </div>
      <h3>${esc(a.nombre)}</h3>
      ${a.descripcion ? `<p class="desc">${esc(a.descripcion)}</p>` : ""}
      <div class="precio">${gs(a.precio)}</div>
    </button>`;
}

// ---------- producto ----------

function abrirProducto(id) {
  const a = articulos.find((x) => String(x.id) === String(id));
  if (!a) return;
  const u = foto(a.imagen_path);
  const ya = carrito[a.id];
  let qty = ya?.qty || 1;

  capa(`
    <div class="grande">
      ${u ? `<img src="${esc(u)}" alt="">`
          : `<div class="sinfoto" style="font-size:52px">${esc(inicial(a.nombre))}</div>`}
    </div>
    <h2>${esc(a.nombre)}</h2>
    ${a.categoria ? `<div class="cat">${esc(a.categoria)}</div>` : ""}
    <div class="precio-g">${gs(a.precio)}</div>
    ${a.descripcion ? `<p class="texto">${esc(a.descripcion)}</p>` : ""}

    <div class="contador">
      <button id="menos" aria-label="Menos">−</button>
      <span class="q" id="qty">${qty}</span>
      <button id="mas" aria-label="Más">+</button>
      <div class="sub" id="sub">${gs(a.precio * qty)}</div>
    </div>

    <label for="nota">Nota para este producto</label>
    <textarea id="nota" placeholder="Color, tamaño, lo que haga falta">${esc(ya?.nota || "")}</textarea>

    <button class="primario" id="agregar">${ya ? "Actualizar el pedido" : "Agregar al pedido"}</button>
    <button class="secundario" id="cerrar">Seguir mirando</button>
  `);

  const pintar = () => {
    $("#qty").textContent = qty;
    $("#sub").textContent = gs(a.precio * qty);
  };
  $("#menos").onclick = () => { qty = Math.max(1, qty - 1); pintar(); };
  $("#mas").onclick = () => { qty = Math.min(999, qty + 1); pintar(); };
  $("#agregar").onclick = () => {
    carrito[a.id] = { id: a.id, nombre: a.nombre, precio: a.precio, imagen_path: a.imagen_path,
                      qty, nota: $("#nota").value.trim() };
    guardar(); cerrarCapa(); dibujar();
  };
  $("#cerrar").onclick = cerrarCapa;
}

// ---------- el pedido ----------

function avisoVacio() {
  capa(`
    <div class="aviso" style="padding:28px 0 8px">
      <b>Tu pedido está vacío</b>
      <p>Tocá un producto para agregarlo.</p>
    </div>
    <button class="primario" id="cerrar">Ver los productos</button>
  `);
  $("#cerrar").onclick = cerrarCapa;
}

function abrirPedido() {
  const ls = items();
  if (!ls.length) return avisoVacio();

  let datos = {};
  try { datos = JSON.parse(localStorage.getItem("datos:" + slug) || "{}"); } catch {}

  capa(`
    <h2 style="margin-top:0">Tu pedido</h2>
    <div>${ls.map(linea).join("")}</div>

    <div class="total"><span>Total</span><span class="n">${gs(total())}</span></div>

    <label for="nom">Tu nombre</label>
    <input id="nom" type="text" value="${esc(datos.nombre || "")}" placeholder="Para saber a quién le preparamos">
    <label for="tel">Tu teléfono</label>
    <input id="tel" type="tel" value="${esc(datos.tel || "")}" placeholder="09xx xxx xxx" inputmode="tel">
    <label for="obs">Algo más que quieras decirnos</label>
    <textarea id="obs" placeholder="Dirección, horario, forma de pago">${esc(datos.obs || "")}</textarea>

    <button class="primario" id="enviar">Pedir por WhatsApp</button>
    <button class="secundario" id="cerrar">Seguir mirando</button>
  `);

  document.querySelectorAll("[data-quitar]").forEach((b) =>
    b.addEventListener("click", () => {
      delete carrito[b.dataset.quitar];
      guardar(); dibujar();
      items().length ? abrirPedido() : cerrarCapa();
    }));

  $("#cerrar").onclick = cerrarCapa;
  $("#enviar").onclick = () => {
    const nombre = $("#nom").value.trim();
    const tel = $("#tel").value.trim();
    const obs = $("#obs").value.trim();
    try { localStorage.setItem("datos:" + slug, JSON.stringify({ nombre, tel, obs })); } catch {}
    location.href = enlaceWhatsapp(nombre, tel, obs);
  };
}

function linea(l) {
  const u = foto(l.imagen_path);
  return `<div class="linea">
    ${u ? `<img class="mini" src="${esc(u)}" alt="">`
        : `<div class="minisin">${esc(inicial(l.nombre))}</div>`}
    <div class="info">
      <b>${esc(l.nombre)}</b>
      <small>${l.qty} × ${gs(l.precio)} · ${gs(l.qty * l.precio)}</small>
      ${l.nota ? `<small>“${esc(l.nota)}”</small>` : ""}
    </div>
    <button class="quitar" data-quitar="${esc(l.id)}">Quitar</button>
  </div>`;
}

/**
 * El pedido, como texto de WhatsApp.
 *
 * Es todo el producto: no se guarda en ningún lado, le llega al negocio donde
 * ya atiende. Por eso el texto tiene que alcanzar solo — quién pide, qué, y
 * cómo ubicarlo.
 */
function enlaceWhatsapp(nombre, tel, obs) {
  const l = [`*Pedido · ${negocio.nombre}*`, ""];
  for (const it of items()) {
    l.push(`• ${it.nombre} — ${it.qty} × ${gs(it.precio)} = ${gs(it.qty * it.precio)}`);
    if (it.nota) l.push(`   (${it.nota})`);
  }
  l.push("", `*Total: ${gs(total())}*`, "");
  if (nombre) l.push(`Nombre: ${nombre}`);
  if (tel) l.push(`Teléfono: ${tel}`);
  if (obs) l.push(`Nota: ${obs}`);
  return `https://wa.me/${waNumero(negocio.whatsapp)}?text=${encodeURIComponent(l.join("\n"))}`;
}

// ---------- hoja ----------

function capa(html) {
  $("#capa").innerHTML = `<div class="velo"><div class="hoja"><div class="cuerpo">${html}</div></div></div>`;
  document.body.style.overflow = "hidden";
  $("#capa .velo").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) cerrarCapa();
  });
}

function cerrarCapa() {
  $("#capa").innerHTML = "";
  document.body.style.overflow = "";
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarCapa(); });
</script>
</body>
</html>
