server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Comprimir lo que se repite mucho. Las imágenes ya vienen comprimidas.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los archivos de /_next/static llevan un hash en el nombre: si cambia el
  # contenido, cambia el nombre. Por eso se pueden cachear para siempre.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El HTML NO se cachea: es lo que apunta a los bundles nuevos después de un
  # deploy. Si se cachea, el navegador sigue cargando la versión vieja.
  #
  # Cualquier ruta desconocida cae en index.html a propósito, en vez de dar 404:
  # la app es una sola página y el enlace de recuperación de contraseña puede
  # volver a una ruta que no existe como archivo. Que siempre abra la app.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
  }
}
