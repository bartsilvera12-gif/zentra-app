# Arma el APK en GitHub, no en la máquina de nadie.
#
# El contenedor donde trabajo no tiene el SDK de Android y no puede bajarlo, y
# pedirle a cada uno que instale Android Studio para probar un cambio es una
# forma de que nadie lo pruebe. Acá sale un APK instalable de cada push, y queda
# guardado con el commit del que salió.
#
# Se dispara a mano (Actions -> Armar APK -> Run workflow) o en cada push a main.
name: Armar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    # A nivel del job, no de un paso: `android:init` vuelve a correr
    # `npm run build` por dentro, y si ahi no llegan las variables, ese segundo
    # build pisa el primero con uno de datos de ejemplo. El APK compila igual y
    # sale con datos falsos. Ya paso.
    env:
      NEXT_PUBLIC_BACKEND: supabase
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_DIRECTORIO_JSON: ${{ secrets.NEXT_PUBLIC_DIRECTORIO_JSON }}
      NEXT_PUBLIC_SOPORTE_WHATSAPP: ${{ secrets.NEXT_PUBLIC_SOPORTE_WHATSAPP }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # El SDK de Android ya viene en el runner; sólo hace falta el JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # Las pruebas antes del APK: un APK que no funciona cuesta una instalación
      # y la confianza de quien lo probó.
      - run: npx tsc --noEmit
      - run: npm test

      # ESTO ES LO QUE IMPORTA: estas variables se hornean adentro del
      # JavaScript al compilar. Si llegan vacías, el APK sale con datos de
      # ejemplo y no hay forma de arreglarlo sin recompilar.
      - name: Compilar el web
        run: |
          if [ -z "$NEXT_PUBLIC_DIRECTORIO_JSON" ]; then
            echo "ERROR: falta el secret NEXT_PUBLIC_DIRECTORIO_JSON."
            echo "Sin el directorio, ningun codigo de empresa resuelve y nadie puede entrar."
            exit 1
          fi
          npm run build

      - name: Generar el proyecto Android
        run: npm run android:init

      # Que el icono generado sea el nuestro y no el que trae Capacitor por
      # defecto. Que el paso de iconos "corra bien" no prueba que haya puesto
      # el nuestro: puede generar el generico y salir con exito igual.
      - name: Verificar que el icono es el de la marca
        run: |
          node -e "
          const sharp = require('sharp');
          const MARCA = [28, 140, 132];   // #1C8C84, el verde de Zentra
          (async () => {
            const f = 'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png';
            const { data } = await sharp(f).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            let n = 0, r = 0, g = 0, b = 0;
            for (let i = 0; i < data.length; i += 4) if (data[i + 3] > 10) { n++; r += data[i]; g += data[i + 1]; b += data[i + 2]; }
            const medio = [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
            const lejos = medio.some((c, i) => Math.abs(c - MARCA[i]) > 12);
            if (lejos) {
              console.error('ERROR: el fondo del icono es ' + medio + ', se esperaba ' + MARCA + '.');
              console.error('Probablemente quedo el icono generico de Capacitor.');
              process.exit(1);
            }
            console.log('OK: el icono es el de la marca (' + medio + ').');
          })();
          "

      - name: Compilar el APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Que el directorio haya quedado adentro de verdad. Buscar "supabase.co"
      # no probaria nada: esa cadena esta tambien en la libreria.
      - name: Verificar que las variables quedaron horneadas
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          d = json.loads(os.environ["DIR_JSON"])
          chunks = "".join(
              p.read_text(errors="ignore")
              for p in pathlib.Path("out/_next/static/chunks").rglob("*.js")
          )
          faltan = [c for c in d if d[c].get("apiUrl", "") not in chunks]
          if faltan:
              sys.exit(f"ERROR: no quedaron en el build las APIs de: {faltan}")
          print("OK: el directorio quedo dentro del build:", ", ".join(d))
          PY
        env:
          DIR_JSON: ${{ secrets.NEXT_PUBLIC_DIRECTORIO_JSON }}

      # Y que el APK lleve adentro ese mismo build, no uno anterior. Lo de
      # arriba mira `out/`; esto mira lo que quedo empaquetado de verdad.
      - name: Verificar que el APK lleva el build correcto
        env:
          DIR_JSON: ${{ secrets.NEXT_PUBLIC_DIRECTORIO_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, sys, zipfile
          d = json.loads(os.environ["DIR_JSON"])
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          texto = ""
          with zipfile.ZipFile(apk) as z:
              for n in z.namelist():
                  if n.startswith("assets/public/") and n.endswith(".js"):
                      texto += z.read(n).decode("utf-8", "ignore")
          faltan = [c for c in d if d[c].get("apiUrl", "") not in texto]
          if faltan:
              sys.exit(f"ERROR: el APK no lleva las APIs de: {faltan}")
          print("OK: el APK lleva el directorio adentro:", ", ".join(d))
          PY

      # Que el APK lleve Firebase adentro, o no va a recibir notificaciones.
      #
      # El build.gradle que genera Capacitor aplica el plugin de Google sólo si
      # encuentra google-services.json, y cuando no lo encuentra lo dice con
      # logger.info — que en una corrida normal de Gradle no se imprime. O sea
      # que un APK sin Firebase compila, instala y anda: lo unico que no hace es
      # recibir notificaciones, y nada lo avisa.
      #
      # Pasó: un commit sobre los iconos borró google-services.json del repo y
      # la fábrica siguió publicando APKs sin notificaciones durante dos dias.
      #
      # Lo que se mira es el recurso que genera el plugin. Si existe, el plugin
      # corrió; si no existe, no corrió. Es la señal mas directa que hay, y no
      # depende de leer el binario del APK.
      - name: Verificar que el APK lleva Firebase
        run: |
          python3 - <<'PY'
          import glob, sys
          encontrados = glob.glob("android/app/build/generated/res/google-services/*/values/values.xml")
          if not encontrados:
              sys.exit(
                  "ERROR: el plugin de Google no corrio, asi que este APK no recibe notificaciones.\n"
                  "Casi siempre es que falta android/app/google-services.json en el repo.\n"
                  "Recuperalo:  git checkout 760579c^ -- android/app/google-services.json"
              )
          for ruta in encontrados:
              with open(ruta, encoding="utf-8") as f:
                  if "google_app_id" not in f.read():
                      sys.exit(f"ERROR: {ruta} no tiene google_app_id; la configuracion de Firebase quedo vacia.")
          print("OK: el APK lleva Firebase (" + ", ".join(encontrados) + ").")
          PY

      # Y que el icono haya entrado al paquete, no solo que se haya generado.
      - name: Verificar que el APK lleva el icono
        run: |
          python3 - <<'PY'
          import sys, zipfile
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              nombres = z.namelist()
          # El XML adaptativo es lo que Android 8+ usa de verdad; sin el, el
          # sistema cae en un PNG viejo o en el generico.
          faltan = [n for n in [
              "res/mipmap-anydpi-v26/ic_launcher.xml",
              "res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png",
              "res/mipmap-xxxhdpi-v4/ic_launcher_background.png",
          ] if n not in nombres]
          if faltan:
              sys.exit("ERROR: al APK le faltan los iconos: " + ", ".join(faltan))
          print("OK: el APK lleva el icono adaptativo.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zentra-movil-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Un link fijo para bajar el ultimo APK, sin entrar a Actions ni
      # descomprimir un zip. Se le puede pasar a cualquiera que tenga que
      # probar: siempre apunta al ultimo, no hay forma de bajar uno viejo por
      # error.
      #
      # El nombre lleva el commit corto adentro: cuando alguien reporta algo,
      # se sabe exactamente que version tenia instalada. "La ultima" no es una
      # respuesta cuando hay tres builds en el dia.
      - name: Publicar el APK en un link fijo
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          corto="${SHA:0:7}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "zentra-movil-$corto.apk"
          gh release delete apk-ultimo --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-ultimo "zentra-movil-$corto.apk" \
            --title "Ultimo APK ($corto)" \
            --notes "Build de $corto. Es un APK de prueba sin firmar para las tiendas: hay que permitir instalar de origenes desconocidos." \
            --prerelease
          echo "Link fijo: https://github.com/${{ github.repository }}/releases/download/apk-ultimo/zentra-movil-$corto.apk"
          echo "O la pagina: https://github.com/${{ github.repository }}/releases/tag/apk-ultimo"
